; E524546-OS — LuaS30-core on ESP32-S3-WROOM-1 (N16R8) + ST7789 240x320
; Lõi Lua 5.1.5 lấy từ D:\MRE\LuaS30-IDE\vendor\lua-5.1.5 (đã copy vào src/lua/)
; API Lua giữ nguyên engine.* / mre.* như LuaS30 (xem doc/reference/API.md)

[env:esp32-s3-st7789]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DESP32S3_N16R8
  ; Giảm cảnh báo từ Lua 5.1.5 C cũ trên GCC mới
  -Wno-error=implicit-function-declaration
  -Wno-error=implicit-int
  -Wno-error=return-mismatch

lib_deps =
  lovyan03/LovyanGFX@^1.2.7

lib_ldf_mode = deep+
lib_compat_mode = soft

extra_scripts = pre:tools/pio_pre.py
