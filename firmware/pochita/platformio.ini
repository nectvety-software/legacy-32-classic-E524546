[platformio]
default_envs = pochita_esp32s3

[env:pochita_esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bodmer/TJpg_Decoder@^1.1.0
  bitbank2/PNGdec@^1.1.6
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  ; Bluedroid BLE API feature guards. This project's include chain defines TRUE,
  ; which otherwise disables the 4.2/5.0 struct definitions in esp_gap_ble_api.h
  ; and breaks the built-in BLE library. Force them on to match the precompiled bt lib.
  -D BLE_42_FEATURE_SUPPORT=TRUE
  -D BLE_50_FEATURE_SUPPORT=TRUE
  ; nofrendo NES emulator core (lib/nofrendo) - expose its headers to the OSD
  ; bridge compiled in src/ (angle-bracket includes across the core subdirs).
  -I lib/nofrendo
  -I lib/nofrendo/cpu
  -I lib/nofrendo/nes
  -I lib/nofrendo/sndhrdw
  -I lib/nofrendo/libsnss
  ; PLE TinyLM on-device LLM engine (single-header) used by src/ai_chat.cpp
  -I lib/ple_tinylm
