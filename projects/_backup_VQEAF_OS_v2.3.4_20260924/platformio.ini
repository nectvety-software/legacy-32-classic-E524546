; VQEAF OS v2.3.4: 12 pixel-art system icon pairs; v2.3.3 N16R8 build preserved.
; No physical GPIOs have been changed. Board definition is project-local.
; Pinned platform / libraries: avoid untested automatic major upgrades.
[platformio]
default_envs = vqeaf_os

[env:vqeaf_os]
platform = espressif32@6.10.0
board = vqeaf_s3_n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.filesystem = littlefs
board_build.partitions = partitions/vqeaf_16mb_ota.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600

; ESP32-S3 Arduino core 2.x: explicit includes in every translation unit,
; conservative deep dependency discovery for vendor JPEG/PNG/NimBLE headers.
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  h2zero/NimBLE-Arduino@2.3.6
  bodmer/TJpg_Decoder@1.1.0
  bitbank2/PNGdec@1.1.6

build_flags =
  -D VQEAF_BOARD_N16R8=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM=1
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=12
  -D TFT_SCLK=48
  -D TFT_CS=14
  -D TFT_DC=47
  -D TFT_RST=3
  -D TFT_BL=39
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  -D USE_FSPI_PORT=1
  ; --- LDF workaround, required for SD_MMC (verified on PlatformIO 6.2.0) ---
  ; SD_MMC.h wraps `#include "FS.h"` in `#ifdef SOC_SDMMC_HOST_SUPPORTED`, and
  ; the whole of SD_MMC.cpp is wrapped in the same guard. That macro is defined
  ; by soc/soc_caps.h, a *header* the LDF preprocessor does not expand, so the
  ; LDF evaluates the guard as false, finds no includes at all for SD_MMC and
  ; therefore never adds libraries/FS/src to its include path ->
  ;   SD_MMC.h:21:10: fatal error: FS.h: No such file or directory
  ; Declaring the macro here lets the LDF see through the guard. It matches
  ; reality (esp32s3 soc_caps.h defines it as 1) and the redefinition is
  ; token-identical, so the real compile is unaffected.
  -D SOC_SDMMC_HOST_SUPPORTED=1
