; Qeafbrowser (Retro-Go UI rewrite) — ESP32-S3 N16R8
; MCU: ESP32-S3-WROOM-1 N16R8 | LCD ST7789 240x320 DỌC | keypad Symbian 3x3+SELECT | SDMMC 1-bit
; Toolchain + libs giữ nguyên từ Qeafbrowser_v1.7 (xem projects/Qeafbrowser_v1.7/platformio.ini)
[env:esp32-s3-st7789]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_build.arduino.cdc_on_boot = 0
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
  -D BOARD_HAS_PSRAM=1
  -D ARDUINO_LOOP_STACK_SIZE=32768
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ARDUINO_USB_MODE=1

; Thư viện vendored trong lib/ (copy từ Qeafbrowser_v1.7/.pio/libdeps) — không phụ thuộc mạng.
; Nguồn: lovyan03/LovyanGFX@^1.2.7, bodmer/TJpg_Decoder@1.1.0, bitbank2/PNGdec@1.1.6
