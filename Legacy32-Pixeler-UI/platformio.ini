[platformio]
default_envs = legacy32

[env:legacy32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Uncomment and set the correct COM port on Windows if PlatformIO does not detect it automatically.
; upload_port = COM5
; monitor_port = COM5

; Legacy-32-Classic E524546
; ESP32-S3-WROOM-1 N16R8: 16 MB QIO flash + 8 MB OPI PSRAM
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions-s3.csv

build_flags =
  -Isrc/
  -Isrc/config/
  -std=gnu++20
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_SUPPORT=1
  -DESP32

; Pixeler is vendored in lib/pixeler, so the project can build without cloning
; the framework separately.
; NOTE: use "deep" (not "deep+"): the "+" makes the LDF evaluate #if/#ifdef
; conditionals, but it cannot resolve ESP-IDF SDK macros such as
; SOC_WIFI_SUPPORTED, so it skips the guarded `#include "Network.h"` in the
; WiFi library and never adds the Networking library's include path. Plain
; "deep" follows all includes unconditionally and resolves the dependency.
lib_ldf_mode = deep
